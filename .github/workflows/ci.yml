name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Instala dependencias
        run: npm ci

      - name: Verifica tipagem
        run: npm run typecheck

      - name: Roda os testes
        run: npm test
