name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck e testes unitarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Instala dependencias
        run: npm ci

      - name: Verifica tipagem
        run: npm run typecheck

      - name: Roda os testes
        run: npm test

  api-tests:
    name: Testes de API (Newman)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Instala dependencias
        run: npm ci

      - name: Prepara variaveis de ambiente
        run: cp .env.example .env

      - name: Sobe a API em background
        run: npm start &

      - name: Aguarda a API responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3333/teams > /dev/null; then
              echo "API respondendo"
              exit 0
            fi
            sleep 1
          done
          echo "API nao subiu em 30s"
          exit 1

      - name: Roda a colecao do Postman
        run: |
          npx --yes newman@6 run docs/f1-api.postman_collection.json \
            -e docs/environments/ci.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - name: Publica o relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.xml
          retention-days: 7